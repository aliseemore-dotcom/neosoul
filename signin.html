<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neo Soul — Sign in</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Cormorant:wght@300&family=Manrope:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<main class="auth"><div class="box">
  <a href="index.html" class="mark">Neo Soul</a>
  <h1>Welcome <em>back</em></h1>
  <p class="sub">Your journal is where you left it.</p>

  <p class="err" id="err" hidden></p>

  <form id="form" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" id="go" type="submit">Open my journal</button>
  </form>

  <p class="alt">No account yet? <a href="join.html">Start free</a></p>
</div></main>

<script type="module">
import { api } from './neosoul.js';
api.getUser().then(u => { if (u) location.replace('journal.html'); });
const err = document.getElementById('err');
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault(); err.hidden = true;
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Opening…';
  try {
    await api.signIn({ email: document.getElementById('email').value.trim().toLowerCase(),
                       password: document.getElementById('pw').value });
    location.href = 'journal.html';
  } catch (ex) {
    err.textContent = ex.message || 'Could not sign in.'; err.hidden = false;
    btn.disabled = false; btn.textContent = 'Open my journal';
  }
});
</script>
</body>
</html>
